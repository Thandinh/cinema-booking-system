<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 Cinema Finder — Bản Đồ Rạp Chiếu Phim</title>
    <meta name="description" content="Tìm rạp chiếu phim gần bạn nhất trên bản đồ" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Search Bar ── */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(99,102,241,0.35);
            border-radius: 10px;
            padding: 6px 14px;
            flex: 1;
            max-width: 360px;
            transition: border-color 0.2s;
        }
        .search-bar:focus-within { border-color: #818cf8; }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #e2e8f0;
            font-size: 0.875rem;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }
        .search-bar input::placeholder { color: #64748b; }

        /* ── Buttons ── */
        .btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99,102,241,0.4);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(99,102,241,0.5); }
        .btn-secondary {
            background: rgba(255,255,255,0.07);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); color: #e2e8f0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* ── Layout ── */
        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: #13131f;
            border-right: 1px solid rgba(99,102,241,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-header h2 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        #cinema-count {
            font-size: 0.75rem;
            color: #6366f1;
            font-weight: 500;
        }

        .cinema-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .cinema-list::-webkit-scrollbar { width: 4px; }
        .cinema-list::-webkit-scrollbar-track { background: transparent; }
        .cinema-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 2px; }

        /* ── Cinema Card ── */
        .cinema-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .cinema-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99,102,241,0.08), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .cinema-card:hover { border-color: rgba(99,102,241,0.45); transform: translateX(2px); }
        .cinema-card:hover::before { opacity: 1; }
        .cinema-card.active { border-color: #6366f1; background: rgba(99,102,241,0.1); }

        .cinema-card-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }
        .cinema-card-city {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #a78bfa;
            background: rgba(167,139,250,0.12);
            border-radius: 4px;
            padding: 1px 6px;
            margin-bottom: 6px;
        }
        .cinema-card-address {
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.4;
        }
        .cinema-card-distance {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #34d399;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ── Status Bar ── */
        .status-bar {
            padding: 10px 16px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.72rem;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Map ── */
        #map {
            flex: 1;
            z-index: 1;
        }

        /* ── Leaflet Popup Custom ── */
        .leaflet-popup-content-wrapper {
            background: #1e1e30 !important;
            border: 1px solid rgba(99,102,241,0.4) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
            color: #e2e8f0 !important;
        }
        .leaflet-popup-tip { background: #1e1e30 !important; }
        .leaflet-popup-content { margin: 14px 16px !important; }

        .popup-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 4px;
        }
        .popup-city {
            font-size: 0.7rem;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .popup-address {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .popup-distance {
            font-size: 0.75rem;
            color: #34d399;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .popup-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s;
        }
        .popup-btn:hover { opacity: 0.85; }

        /* ── Loading Overlay ── */
        #loading {
            position: absolute;
            inset: 0;
            background: rgba(15,15,26,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { font-size: 0.875rem; color: #94a3b8; }

        /* ── Empty State ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #475569;
            gap: 8px;
        }
        .empty-state .icon { font-size: 2rem; }
        .empty-state p { font-size: 0.8rem; }
    </style>
</head>

<body>

<!-- Loading Overlay -->
<div id="loading">
    <div class="spinner"></div>
    <p>Đang tải bản đồ rạp chiếu...</p>
</div>

<!-- Header -->
<header>
    <h1>🎬 Cinema Finder</h1>

    <div class="search-bar">
        <svg width="14" height="14" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Tìm rạp theo tên, thành phố..." />
    </div>

    <button class="btn btn-primary" id="btn-locate">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        Rạp gần tôi
    </button>

    <button class="btn btn-secondary" id="btn-reset">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
        </svg>
        Đặt lại
    </button>
</header>

<!-- Layout -->
<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Danh sách rạp</h2>
            <div id="cinema-count">Đang tải...</div>
        </div>
        <div class="cinema-list" id="cinema-list">
            <div class="empty-state">
                <div class="icon">🎭</div>
                <p>Đang tải danh sách rạp...</p>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-dot"></div>
            <span id="status-text">OpenStreetMap · CartoDB Dark · Leaflet 1.9.4</span>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs=" crossorigin=""></script>

<script>
    // =========================================================================
    // CONFIG
    // =========================================================================
    const API_BASE = 'http://localhost:8080';
    const MAP_CENTER = [10.762622, 106.660172]; // TP.HCM mặc định
    const MAP_ZOOM = 12;

    // =========================================================================
    // MAP INIT
    // =========================================================================
    const map = L.map('map', {
        center: MAP_CENTER,
        zoom: MAP_ZOOM,
        zoomControl: true,
    });

    // CartoDB Dark Tile — đẹp + miễn phí
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // =========================================================================
    // CUSTOM MARKER ICON
    // =========================================================================
    const cinemaIcon = L.divIcon({
        html: `<div style="
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            width: 36px; height: 36px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 3px solid rgba(255,255,255,0.25);
            box-shadow: 0 4px 16px rgba(99,102,241,0.5);
            display: flex; align-items: center; justify-content: center;
        ">
            <span style="transform: rotate(45deg); font-size: 16px; line-height:1;">🎬</span>
        </div>`,
        className: '',
        iconSize: [36, 36],
        iconAnchor: [18, 36],
        popupAnchor: [0, -38]
    });

    const nearestIcon = L.divIcon({
        html: `<div style="
            background: linear-gradient(135deg, #10b981, #059669);
            width: 36px; height: 36px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 3px solid rgba(255,255,255,0.25);
            box-shadow: 0 4px 16px rgba(16,185,129,0.5);
            display: flex; align-items: center; justify-content: center;
        ">
            <span style="transform: rotate(45deg); font-size: 16px; line-height:1;">📍</span>
        </div>`,
        className: '',
        iconSize: [36, 36],
        iconAnchor: [18, 36],
        popupAnchor: [0, -38]
    });

    // =========================================================================
    // STATE
    // =========================================================================
    let allCinemas = [];
    let markers = {};
    let userMarker = null;
    let activeCardId = null;

    // =========================================================================
    // FETCH MAP DATA FROM BACKEND
    // =========================================================================
    async function loadCinemas() {
        try {
            const res = await fetch(`${API_BASE}/api/v1/cinemas/map`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            // ApiResponse wrapper: json.result
            allCinemas = json.result || [];
            renderMarkers(allCinemas);
            renderSidebar(allCinemas);
        } catch (err) {
            console.error('Lỗi tải danh sách rạp:', err);
            // Demo: dữ liệu mock khi backend chưa chạy
            allCinemas = getMockCinemas();
            renderMarkers(allCinemas);
            renderSidebar(allCinemas);
            document.getElementById('status-text').textContent = '⚠️ Demo mode (backend offline)';
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // =========================================================================
    // RENDER MARKERS ON MAP
    // =========================================================================
    function renderMarkers(cinemas, nearestIds = new Set()) {
        // Xóa marker cũ
        Object.values(markers).forEach(m => m.remove());
        markers = {};

        cinemas.forEach(cinema => {
            if (!cinema.latitude || !cinema.longitude) return;

            const isNearest = nearestIds.has(cinema.id);
            const icon = isNearest ? nearestIcon : cinemaIcon;

            const marker = L.marker([cinema.latitude, cinema.longitude], { icon })
                .addTo(map)
                .bindPopup(buildPopupHtml(cinema), {
                    minWidth: 220,
                    maxWidth: 260,
                });

            markers[cinema.id] = marker;

            // Click marker → highlight card
            marker.on('click', () => {
                highlightCard(cinema.id);
                scrollToCard(cinema.id);
            });
        });
    }

    function buildPopupHtml(cinema) {
        const distHtml = cinema.distanceKm != null
            ? `<div class="popup-distance">📍 ${cinema.distanceKm.toFixed(2)} km</div>`
            : '';
        return `
            <div class="popup-title">${cinema.name}</div>
            <div class="popup-city">🏙️ ${cinema.city || 'Không rõ'}</div>
            <div class="popup-address">${cinema.address || ''}</div>
            ${distHtml}
            <a class="popup-btn" href="/cinemas/${cinema.id}/showtimes">
                🎟 Xem lịch chiếu
            </a>
        `;
    }

    // =========================================================================
    // RENDER SIDEBAR CARDS
    // =========================================================================
    function renderSidebar(cinemas) {
        const listEl = document.getElementById('cinema-list');
        const countEl = document.getElementById('cinema-count');

        countEl.textContent = `${cinemas.length} rạp`;

        if (cinemas.length === 0) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <p>Không tìm thấy rạp nào</p>
                </div>`;
            return;
        }

        listEl.innerHTML = cinemas.map(c => `
            <div class="cinema-card" id="card-${c.id}" onclick="focusCinema('${c.id}')">
                <div class="cinema-card-name">${c.name}</div>
                ${c.city ? `<div class="cinema-card-city">🏙️ ${c.city}</div>` : ''}
                <div class="cinema-card-address">${c.address || 'Chưa có địa chỉ'}</div>
                ${c.distanceKm != null ? `<div class="cinema-card-distance">📍 ${c.distanceKm.toFixed(2)} km</div>` : ''}
            </div>
        `).join('');
    }

    // =========================================================================
    // FOCUS / HIGHLIGHT
    // =========================================================================
    function focusCinema(id) {
        const cinema = allCinemas.find(c => c.id === id);
        if (!cinema || !cinema.latitude) return;

        map.flyTo([cinema.latitude, cinema.longitude], 15, { duration: 0.8 });

        if (markers[id]) {
            markers[id].openPopup();
        }
        highlightCard(id);
    }

    function highlightCard(id) {
        if (activeCardId) {
            document.getElementById(`card-${activeCardId}`)?.classList.remove('active');
        }
        activeCardId = id;
        document.getElementById(`card-${id}`)?.classList.add('active');
    }

    function scrollToCard(id) {
        document.getElementById(`card-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // =========================================================================
    // GEOLOCATION + FIND NEAREST
    // =========================================================================
    document.getElementById('btn-locate').addEventListener('click', async () => {
        const btn = document.getElementById('btn-locate');
        btn.disabled = true;
        btn.innerHTML = '⏳ Đang xác định vị trí...';

        if (!navigator.geolocation) {
            alert('Trình duyệt của bạn không hỗ trợ Geolocation.');
            btn.disabled = false;
            btn.innerHTML = '📍 Rạp gần tôi';
            return;
        }

        navigator.geolocation.getCurrentPosition(async pos => {
            const { latitude: lat, longitude: lng } = pos.coords;

            // Marker vị trí người dùng
            if (userMarker) userMarker.remove();
            userMarker = L.circleMarker([lat, lng], {
                radius: 10,
                fillColor: '#f59e0b',
                color: '#fff',
                weight: 2,
                fillOpacity: 0.9
            }).addTo(map).bindPopup('<b>📍 Vị trí của bạn</b>').openPopup();

            map.flyTo([lat, lng], 13, { duration: 1 });

            try {
                // Gọi API nearest từ backend
                const res = await fetch(`${API_BASE}/api/v1/cinemas/nearest?lat=${lat}&lng=${lng}&limit=5`);
                const json = await res.json();
                const nearest = json.result || [];

                const nearestIds = new Set(nearest.map(c => c.id));

                // Merge distanceKm vào allCinemas để sidebar hiển thị
                allCinemas = allCinemas.map(c => ({
                    ...c,
                    distanceKm: nearest.find(n => n.id === c.id)?.distanceKm ?? null
                }));

                // Sort: rạp gần nhất lên đầu
                const sorted = [
                    ...nearest,
                    ...allCinemas.filter(c => !nearestIds.has(c.id))
                ];

                renderMarkers(sorted, nearestIds);
                renderSidebar(sorted);

                document.getElementById('status-text').textContent =
                    `✅ Tìm thấy ${nearest.length} rạp gần bạn`;

            } catch (err) {
                console.error(err);
                alert('Lỗi khi tìm rạp gần bạn. Vui lòng thử lại.');
            }

            btn.disabled = false;
            btn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Rạp gần tôi`;

        }, err => {
            alert('Không thể lấy vị trí: ' + err.message);
            btn.disabled = false;
            btn.innerHTML = '📍 Rạp gần tôi';
        });
    });

    // =========================================================================
    // RESET
    // =========================================================================
    document.getElementById('btn-reset').addEventListener('click', () => {
        if (userMarker) { userMarker.remove(); userMarker = null; }
        allCinemas = allCinemas.map(c => ({ ...c, distanceKm: null }));
        renderMarkers(allCinemas);
        renderSidebar(allCinemas);
        map.flyTo(MAP_CENTER, MAP_ZOOM, { duration: 0.8 });
        document.getElementById('status-text').textContent = 'OpenStreetMap · CartoDB Dark · Leaflet 1.9.4';
        document.getElementById('search-input').value = '';
    });

    // =========================================================================
    // SEARCH FILTER
    // =========================================================================
    document.getElementById('search-input').addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        if (!q) {
            renderSidebar(allCinemas);
            renderMarkers(allCinemas);
            return;
        }
        const filtered = allCinemas.filter(c =>
            c.name?.toLowerCase().includes(q) ||
            c.city?.toLowerCase().includes(q) ||
            c.address?.toLowerCase().includes(q)
        );
        renderSidebar(filtered);
        renderMarkers(filtered);

        if (filtered.length === 1 && filtered[0].latitude) {
            map.flyTo([filtered[0].latitude, filtered[0].longitude], 15);
        }
    });

    // =========================================================================
    // MOCK DATA (khi backend chưa chạy — để demo)
    // =========================================================================
    function getMockCinemas() {
        return [
            { id: '1', name: 'CGV Vincom Center', address: '72 Lê Thánh Tôn, Q.1', city: 'TP.HCM', latitude: 10.7769, longitude: 106.7009 },
            { id: '2', name: 'Lotte Cinema Nowzone', address: '235 Nguyễn Văn Cừ, Q.1', city: 'TP.HCM', latitude: 10.7583, longitude: 106.6819 },
