spring:
  application:
    name: cinema-booking-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT_EXTERNAL:5433}/${DB_NAME:cinema_booking}
    username: ${DB_USER:cinema_user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
        query:
          fail_on_pagination_over_collection_fetch: true

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  # Cấu hình gửi Email (Sử dụng Mailtrap.io để test môi trường dev)
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

vnpay:
  tmnCode: ${VNP_TMN_CODE:YOUR_TMN_CODE}
  hashSecret: ${VNP_HASH_SECRET:YOUR_HASH_SECRET}
  url: ${VNP_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNP_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-callback}
  version: 2.1.0
  command: pay

booking:
  seat-hold-minutes: ${BOOKING_SEAT_HOLD_MINUTES:${BOOKING_PENDING_TIMEOUT_MINUTES:10}}
  pending-timeout-minutes: ${BOOKING_PENDING_TIMEOUT_MINUTES:10}
  expired-hold-scan-delay-ms: ${BOOKING_EXPIRED_HOLD_SCAN_DELAY_MS:30000}
  expired-hold-scan-limit: ${BOOKING_EXPIRED_HOLD_SCAN_LIMIT:500}
  expired-booking-scan-delay-ms: ${BOOKING_EXPIRED_BOOKING_SCAN_DELAY_MS:30000}
  expired-booking-scan-limit: ${BOOKING_EXPIRED_BOOKING_SCAN_LIMIT:200}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  email-verification:
    expires-minutes: ${EMAIL_VERIFICATION_EXPIRES_MINUTES:1440}

server:
  port: ${SERVER_PORT:8080}

jwt:
  signer-key: ${JWT_SECRET:default-dev-secret-key-32-chars-minimum}
  access-token-valid-duration: 3600
  refresh-token-valid-duration: 604800

ticket:
  qr-secret: ${TICKET_QR_SECRET:${JWT_SECRET:default-dev-secret-key-32-chars-minimum}}
  check-in-early-minutes: ${TICKET_CHECK_IN_EARLY_MINUTES:30}

logging:
  file:
    name: logs/application.log
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:WARN}
