services:
  postgres:
    image: cinema-booking-postgres:15
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:15
    container_name: postgres-cinema
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-cinema_booking}
      POSTGRES_USER: ${DB_USER:-cinema_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: ${TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${DB_PORT_EXTERNAL:-5433}:${DB_PORT_INTERNAL:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cinema-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cinema_user} -d ${DB_NAME:-cinema_booking}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  cinema-network: